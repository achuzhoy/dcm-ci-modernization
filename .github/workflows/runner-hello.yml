name: Runner hello
run-name: "Runner hello on ${{ inputs.runner_target }}"

on:
  workflow_dispatch:
    inputs:
      runner_target:
        description: Choose the runner for this test
        required: true
        type: choice
        options:
          - ocp-edge34.lab.eng.tlv2.redhat.com
          - sealusa35.ecosys.eng.rdu2.dc.redhat.com

permissions: {}

jobs:
  hello:
    name: "Hello from ${{ inputs.runner_target }}"
    runs-on: [self-hosted, linux, "${{ inputs.runner_target }}"]
    timeout-minutes: 5

    steps:
      - name: Confirm runner execution
        run: |
          echo "Hello from GitHub Actions."
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"
          wall "Hello Vlad1"
